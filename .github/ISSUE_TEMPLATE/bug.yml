name: Bug
description: untaped does something wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and its output (remove tokens and private data).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`untaped --version`"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: untaped doctor
      description: "Output of `untaped doctor`, if relevant."
      render: text
