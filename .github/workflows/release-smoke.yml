name: Release Smoke

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unified-app-wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure isolated smoke home
        run: |
          set -euo pipefail
          home_dir="$RUNNER_TEMP/untaped-smoke-home"
          mkdir -p "$home_dir"
          echo "HOME=$home_dir" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Build the unified app wheel
        run: uv build --wheel --no-sources

      - name: Install the built wheel into an isolated venv
        run: |
          set -euo pipefail
          uv venv --python 3.14 "$RUNNER_TEMP/untaped-wheel"
          uv pip install --python "$RUNNER_TEMP/untaped-wheel/bin/python" dist/*.whl

      - name: Run the unified app smoke
        run: |
          set -euo pipefail
          python3 .github/release/release.py smoke-unified \
            --package untaped \
            --version "$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" \
            --venv "$RUNNER_TEMP/untaped-wheel" \
            --console-script untaped
