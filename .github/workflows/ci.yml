name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel in-flight runs on main — a fast follow-up merge would
  # otherwise discard the merge-commit's gate run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: CI (Python 3.14)
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Cache pre-commit hook envs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Shared release helper tests
        run: |
          python3 .github/release/release.py verify-version --help
          python3 .github/release/release.py verify-candidate --help
          python3 .github/release/release.py smoke-unified --help
          uv run --no-project --with pytest python -m pytest .github/release/tests -q --confcutdir=.github/release -o addopts=

      - name: Sync workspace
        # `--frozen` forbids re-resolving: CI installs exactly what `uv.lock`
        # pins, so a stale lock surfaces as a sync failure instead of a silent
        # in-CI resolve that diverges from local installs.
        run: uv sync --frozen --python 3.14 --all-packages

      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -n auto --cov --cov-report=term-missing --durations=25

  # Build the wheel, install it into a clean venv, and run the same smoke the
  # release workflow runs on its candidate and published package.
  unified-app-wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure isolated smoke home
        run: |
          set -euo pipefail
          home_dir="$RUNNER_TEMP/untaped-smoke-home"
          mkdir -p "$home_dir"
          echo "HOME=$home_dir" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Build the unified app wheel
        run: uv build --wheel --no-sources

      - name: Install the built wheel into an isolated venv
        run: |
          set -euo pipefail
          uv venv --python 3.14 "$RUNNER_TEMP/untaped-wheel"
          uv pip install --python "$RUNNER_TEMP/untaped-wheel/bin/python" dist/*.whl

      - name: Run the unified app smoke
        run: |
          set -euo pipefail
          python3 .github/release/release.py smoke-unified \
            --package untaped \
            --version "$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" \
            --venv "$RUNNER_TEMP/untaped-wheel" \
            --console-script untaped
