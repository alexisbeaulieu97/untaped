name: CI

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-probe:
    runs-on: windows-latest
    timeout-minutes: 40
    name: Windows probe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.11.26"
      - name: Sync workspace
        run: uv sync --frozen --python 3.14 --all-packages
      - name: CLI smoke
        continue-on-error: true
        env:
          UNTAPED_HOME: ${{ runner.temp }}/home
        run: |
          set -x
          uv run untaped --help || true
          uv run untaped doctor || true
          uv run untaped config list || true
          uv run untaped workspace --help || true
          uv run untaped lint || true
      - name: Pytest (collect)
        continue-on-error: true
        run: uv run pytest --collect-only -q -o addopts="--import-mode=importlib" 2>&1 | tail -40
      - name: Pytest
        continue-on-error: true
        run: |
          uv run pytest -n auto -q --no-cov -o addopts="--import-mode=importlib" -rfE 2>&1 | tee pytest.log | tail -400
      - name: Failure summary
        if: always()
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | sed -E 's/::.*? - /  /' | cut -c1-220 > failures.txt || true
          wc -l failures.txt
          grep -E "^(FAILED|ERROR) " pytest.log | sed -E 's/^(FAILED|ERROR) ([^:]+)::.*/\2/' | sort | uniq -c | sort -rn | head -80
          echo "== top error reasons"
          grep -E "^(FAILED|ERROR) " pytest.log | sed -E 's/.* - //' | cut -c1-120 | sort | uniq -c | sort -rn | head -60
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-pytest
          path: |
            pytest.log
            failures.txt
