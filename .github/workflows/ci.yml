name: CI

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-probe:
    runs-on: windows-latest
    timeout-minutes: 40
    name: Windows probe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.11.26"
      - name: Sync workspace
        run: uv sync --frozen --python 3.14 --all-packages
      - name: CLI smoke
        continue-on-error: true
        env:
          UNTAPED_HOME: ${{ runner.temp }}/home
        run: |
          {
          for c in "--help" "doctor" "config list" "workspace --help" "lint" "dotfiles --help" "awx --help" "workspace create demo" "workspace list"; do
            echo "### untaped $c"; uv run untaped $c 2>&1 | head -25; echo "exit=${PIPESTATUS[0]}"
          done
          } > smoke.txt 2>&1
      - name: Plugin load probe
        env:
          UNTAPED_HOME: ${{ runner.temp }}/home
        run: |
          for m in untaped_workspace.plugin untaped_dotfiles.plugin untaped_lint.plugin; do echo "### import $m"; uv run python -c "import $m" 2>&1 | tail -8; done
          echo "### plugin list"; uv run untaped plugin list 2>&1 | tail -30
          echo "### doctor"; uv run untaped doctor 2>&1 | tail -40
          echo "### workspace create"; uv run untaped workspace create demo 2>&1 | tail -30
