name: CI

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-probe:
    runs-on: windows-latest
    timeout-minutes: 40
    name: Windows probe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.11.26"
      - name: Sync workspace
        run: uv sync --frozen --python 3.14 --all-packages
      - name: CLI smoke
        continue-on-error: true
        env:
          UNTAPED_HOME: ${{ runner.temp }}/home
        run: |
          {
          for c in "--help" "doctor" "config list" "workspace --help" "lint" "dotfiles --help" "awx --help" "workspace create demo" "workspace list"; do
            echo "### untaped $c"; uv run untaped $c 2>&1 | head -25; echo "exit=${PIPESTATUS[0]}"
          done
          } > smoke.txt 2>&1
      - name: Pytest
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/fakehome"
          export HOME="$RUNNER_TEMP/fakehome" USERPROFILE="$(cygpath -w "$RUNNER_TEMP/fakehome")"
          uv run pytest -n auto -q --no-cov -o addopts="--import-mode=importlib" -rfE 2>&1 > pytest.log 2>&1; tail -3 pytest.log
      - name: Failure summary
        if: always()
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | sed -E 's/::.*? - /  /' | cut -c1-220 > failures.txt || true
          wc -l failures.txt
          grep -E "^(FAILED|ERROR) " pytest.log | sed -E 's/^(FAILED|ERROR) ([^:]+)::.*/\2/' | sort | uniq -c | sort -rn | head -40
          echo "== top error reasons"
          grep -E "^(FAILED|ERROR) " pytest.log | sed -E 's/.* - //' | cut -c1-140 | sort | uniq -c | sort -rn | head -90
          echo "== smoke"; cat smoke.txt
          tail -2 pytest.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-pytest
          path: |
            pytest.log
            failures.txt
