name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel in-flight runs on main — a fast follow-up merge would
  # otherwise discard the merge-commit's gate run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            supported: false
          - python-version: "3.13"
            supported: false
          - python-version: "3.14"
            supported: true
    name: CI (Python ${{ matrix.python-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.11.26"
          enable-cache: true
          # The matrix keeps unsupported-floor rejection visible beside the
          # supported 3.14 job.

      - name: Cache pre-commit hook envs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Shared release helper tests
        if: matrix.supported == true
        run: |
          python3 .github/release/release.py verify-version --help
          python3 .github/release/release.py verify-candidate --help
          python3 .github/release/release.py smoke-unified --help
          uv run --no-project --with pytest python -m pytest .github/release/tests -q --confcutdir=.github/release -o addopts=

      - name: Install unsupported interpreter
        if: matrix.supported == false
        run: uv python install "${{ matrix.python-version }}"

      - name: Reject unsupported Python floor
        if: matrix.supported == false
        run: |
          set +e
          uv sync --frozen --python "${{ matrix.python-version }}" --all-packages >"$RUNNER_TEMP/uv-sync.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/uv-sync.log"
          test "$status" -ne 0
          grep -F 'incompatible with the project' "$RUNNER_TEMP/uv-sync.log"
          grep -F '>=3.14' "$RUNNER_TEMP/uv-sync.log"

      - name: Sync workspace
        if: matrix.supported == true
        # `--frozen` forbids re-resolving: CI installs exactly what `uv.lock`
        # pins, so a stale lock surfaces as a sync failure instead of a silent
        # in-CI resolve that diverges from local installs.
        run: uv sync --frozen --python "${{ matrix.python-version }}" --all-packages

      - name: Pre-commit hooks
        if: matrix.supported == true
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: mypy
        if: matrix.supported == true
        run: uv run mypy

      - name: Pytest
        if: matrix.supported == true
        run: uv run pytest --cov --cov-report=term-missing
