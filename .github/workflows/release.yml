name: Release

# A push to main that changes the package version releases it to PyPI once
# the pypi environment is approved, then tags the built commit and creates the
# GitHub release. A pushed v* tag on main releases too, as the fallback. A
# manual dispatch (on any ref, a tag included) runs the same build as a
# TestPyPI rehearsal. `scripts/release.py route` decides; the checks live in
# scripts/release.py too.
"on":
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes.
    paths: [packages/untaped/pyproject.toml]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The one routing decision. Later jobs read its outputs: version, index
  # (pypi, testpypi or none) and tag (empty unless index is pypi).
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.route.outputs.version }}
      index: ${{ steps.route.outputs.index }}
      tag: ${{ steps.route.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # route reads the version at the push's before commit.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      # The outputs are written only once route succeeded; the reason goes
      # to the log and the job summary too.
      - name: Route
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/release.py route --event "$EVENT_NAME" --ref-type "$REF_TYPE" --ref-name "$REF_NAME" --repository "$REPOSITORY" --before "$BEFORE" > route.txt
          tee -a "$GITHUB_OUTPUT" < route.txt
          grep '^reason=' route.txt | cut -d= -f2- >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: route
    if: needs.route.outputs.index != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.route.outputs.version }}
      INDEX: ${{ needs.route.outputs.index }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Check versions and pins
        run: uv run --no-sync python scripts/release.py check "$VERSION"

      - name: Release notes
        run: uv run --no-sync python scripts/release.py notes "$VERSION" > release-notes.md

      # The PyPI page is the README at build time: point its blob/main links
      # at this release's tag, in this checkout only.
      - name: Point README links at the tag
        run: uv run --no-sync python scripts/release.py readmes "$VERSION"

      - name: Build
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --all-packages --no-sources --out-dir dist
          # uv writes dist/.gitignore; drop it so the artifact check stays strict.
          rm -f dist/.gitignore

      - name: Check artifacts
        run: uv run --no-sync python scripts/release.py check "$VERSION" --dist dist

      - name: Configure isolated smoke home
        run: |
          set -euo pipefail
          home_dir="$RUNNER_TEMP/untaped-smoke-home"
          mkdir -p "$home_dir"
          echo "HOME=$home_dir" >> "$GITHUB_ENV"

      - name: Smoke the wheels in a clean venv
        run: |
          set -euo pipefail
          uv venv --python 3.14 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          uv run --no-sync python scripts/release.py smoke "$RUNNER_TEMP/smoke/bin/untaped" "$VERSION"

      - name: Compare with the index
        run: uv run --no-sync python scripts/release.py index "$VERSION" --dist dist --index "$INDEX"

      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    needs: [route, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.route.outputs.index }}
    permissions:
      id-token: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        if: needs.route.outputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true
          attestations: true

      - name: Publish to TestPyPI
        if: needs.route.outputs.index != 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true
          attestations: true

  verify:
    needs: [route, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.route.outputs.version }}
      INDEX: ${{ needs.route.outputs.index }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      - name: Every file is on the index with the built bytes
        run: uv run --no-sync python scripts/release.py index "$VERSION" --dist dist --index "$INDEX" --complete

      - name: Configure isolated smoke home
        run: |
          set -euo pipefail
          home_dir="$RUNNER_TEMP/untaped-published-smoke-home"
          mkdir -p "$home_dir"
          echo "HOME=$home_dir" >> "$GITHUB_ENV"

      - name: Install from the index and smoke
        run: |
          set -euo pipefail
          # A rehearsal adds TestPyPI to PyPI. Under unsafe-best-match every
          # dependency resolves to the highest compatible version across both
          # indexes; that is accepted for rehearsals only, and production
          # installs from PyPI alone.
          index_env=()
          if [ "$INDEX" = testpypi ]; then
            index_env=(UV_INDEX=https://test.pypi.org/simple/ UV_INDEX_STRATEGY=unsafe-best-match)
          fi
          # index --complete already waited for the files; this only absorbs
          # a lagging installer view of the index.
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/published"
            uv venv -q --python 3.14 "$RUNNER_TEMP/published"
            if env "${index_env[@]}" uv pip install --python "$RUNNER_TEMP/published/bin/python" --refresh "untaped[all]==$VERSION"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::untaped[all]==$VERSION is not installable from $INDEX"
              exit 1
            fi
            sleep 10
          done
          uv run --no-sync python scripts/release.py smoke "$RUNNER_TEMP/published/bin/untaped" "$VERSION"

  # The tag comes after verify, so it marks what PyPI holds, and before the
  # GitHub release, which needs it. A tag created with the GITHUB_TOKEN
  # starts no second run.
  release:
    needs: [route, verify]
    if: needs.route.outputs.index == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.route.outputs.tag }}
      VERSION: ${{ needs.route.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-notes
          path: .

      - name: Tag the built commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/release.py tag "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Draft, attach, then publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/release.py github-release "$VERSION" --tag "$TAG" --repo "$GITHUB_REPOSITORY" --dist dist --notes release-notes.md
