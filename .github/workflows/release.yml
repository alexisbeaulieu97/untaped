name: Release

# A pushed v* tag publishes to PyPI and creates the GitHub release; a manual
# dispatch (on any ref, a tag included) runs the same build as a TestPyPI
# rehearsal. The checks live in scripts/release.py.
"on":
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      production: ${{ steps.route.outputs.production }}
      index: ${{ steps.route.outputs.index }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      # The one routing decision: only a pushed tag is production (PyPI and
      # the GitHub release); a dispatch, even on a tag, is a TestPyPI
      # rehearsal. Later steps read PRODUCTION and INDEX, later jobs the
      # build outputs.
      - name: Route
        id: route
        env:
          PRODUCTION: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          if [ "$PRODUCTION" = true ]; then index=pypi; else index=testpypi; fi
          echo "PRODUCTION=$PRODUCTION" >> "$GITHUB_ENV"
          echo "INDEX=$index" >> "$GITHUB_ENV"
          echo "production=$PRODUCTION" >> "$GITHUB_OUTPUT"
          echo "index=$index" >> "$GITHUB_OUTPUT"

      - name: Release version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$PRODUCTION" = true ]; then
            # --tag also fails unless the tagged commit is on main.
            version="$(uv run --no-sync python scripts/release.py version --tag "$REF_NAME")"
          else
            version="$(uv run --no-sync python scripts/release.py version)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check versions and pins
        run: uv run --no-sync python scripts/release.py check "$VERSION"

      - name: Release notes
        run: uv run --no-sync python scripts/release.py notes "$VERSION" > release-notes.md

      - name: Build
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --all-packages --no-sources --out-dir dist
          # uv writes dist/.gitignore; drop it so the artifact check stays strict.
          rm -f dist/.gitignore

      - name: Check artifacts
        run: uv run --no-sync python scripts/release.py check "$VERSION" --dist dist

      - name: Configure isolated smoke home
        run: |
          set -euo pipefail
          home_dir="$RUNNER_TEMP/untaped-smoke-home"
          mkdir -p "$home_dir"
          echo "HOME=$home_dir" >> "$GITHUB_ENV"

      - name: Smoke the wheels in a clean venv
        run: |
          set -euo pipefail
          uv venv --python 3.14 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          uv run --no-sync python scripts/release.py smoke "$RUNNER_TEMP/smoke/bin/untaped" "$VERSION"

      - name: Compare with the index
        run: uv run --no-sync python scripts/release.py index "$VERSION" --dist dist --index "$INDEX"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.build.outputs.index }}
    permissions:
      id-token: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        if: needs.build.outputs.production == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true
          attestations: true

      - name: Publish to TestPyPI
        if: needs.build.outputs.production != 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true
          attestations: true

  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.build.outputs.version }}
      INDEX: ${{ needs.build.outputs.index }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      - name: Every file is on the index with the built bytes
        run: uv run --no-sync python scripts/release.py index "$VERSION" --dist dist --index "$INDEX" --complete

      - name: Configure isolated smoke home
        run: |
          set -euo pipefail
          home_dir="$RUNNER_TEMP/untaped-published-smoke-home"
          mkdir -p "$home_dir"
          echo "HOME=$home_dir" >> "$GITHUB_ENV"

      - name: Install from the index and smoke
        run: |
          set -euo pipefail
          # A rehearsal adds TestPyPI to PyPI. Under unsafe-best-match every
          # dependency resolves to the highest compatible version across both
          # indexes; that is accepted for rehearsals only, and production
          # installs from PyPI alone.
          index_env=()
          if [ "$INDEX" = testpypi ]; then
            index_env=(UV_INDEX=https://test.pypi.org/simple/ UV_INDEX_STRATEGY=unsafe-best-match)
          fi
          # index --complete already waited for the files; this only absorbs
          # a lagging installer view of the index.
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/published"
            uv venv -q --python 3.14 "$RUNNER_TEMP/published"
            if env "${index_env[@]}" uv pip install --python "$RUNNER_TEMP/published/bin/python" --refresh "untaped[all]==$VERSION"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::untaped[all]==$VERSION is not installable from $INDEX"
              exit 1
            fi
            sleep 10
          done
          uv run --no-sync python scripts/release.py smoke "$RUNNER_TEMP/published/bin/untaped" "$VERSION"

  github-release:
    needs: [build, verify]
    if: needs.build.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-notes
          path: .

      - name: Draft, attach, then publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/release.py github-release "$VERSION" --tag "$TAG" --repo "$GITHUB_REPOSITORY" --dist dist --notes release-notes.md
