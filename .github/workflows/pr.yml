name: PR

# Checks on the pull request itself (scripts/check_pr.py): its drift review
# and its changelog fragment. A separate workflow so that editing the PR body
# re-runs only this.
"on":
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    # Dependabot's update PRs carry no drift review.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --frozen --python 3.14

      - name: Drift review and changelog
        run: uv run --no-sync python scripts/check_pr.py "$GITHUB_EVENT_PATH"

      - name: Changelog draft
        # Every fragment's PR link derives; the draft is the next release's section.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: uv run --no-sync python scripts/changelog.py draft --pr "$PR_NUMBER"
