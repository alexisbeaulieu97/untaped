# Weekly update PRs for the pinned actions and the uv lock. An action bump
# also updates EXPECTED_ACTION_REFS in tests/repo/test_workflows.py.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
