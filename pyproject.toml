[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
untaped = { workspace = true }
untaped-awx = { workspace = true }
untaped-recipe = { workspace = true }
untaped-jira = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260518",
    "untaped[all]",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# First-party code for import sorting: each package's src/ and the test packages.
src = [".", "packages/*/src", "packages/*/tests", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "C90",  # mccabe complexity (gate set in [tool.ruff.lint.mccabe])
    "RUF",  # ruff-specific
]
extend-select = ["PLC0415"]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Tests can use assert statements; in-function imports are routine and
# idiomatic in tests (no startup-latency cost).
"**/tests/**" = ["S101", "PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
# Type-check every package's src/ and the release script; tests are validated by running them.
files = [
    "packages/untaped/src",
    "packages/untaped-jira/src",
    "packages/untaped-recipe/src",
    "packages/untaped-awx/src",
    "scripts/release.py",
]
mypy_path = ["packages/untaped/src", "packages/untaped-jira/src", "packages/untaped-recipe/src", "packages/untaped-awx/src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages/untaped/tests", "packages/untaped-jira/tests", "packages/untaped-recipe/tests", "tests", "packages/untaped-awx/tests"]
pythonpath = ["scripts", "packages/untaped/tests", "packages/untaped-jira/tests", "packages/untaped-recipe/tests", "packages/untaped-awx/tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "integration: cross-package or external-service tests",
]

[tool.coverage.run]
branch = true
source = ["packages/untaped/src", "packages/untaped-jira/src", "packages/untaped-recipe/src", "packages/untaped-awx/src"]
omit = ["**/tests/**", "**/__main__.py"]

[tool.coverage.report]
fail_under = 89
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
