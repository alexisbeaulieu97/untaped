[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
untaped = { workspace = true }
untaped-ansible = { workspace = true }
untaped-awx = { workspace = true }
untaped-dotfiles = { workspace = true }
untaped-github = { workspace = true }
untaped-jira = { workspace = true }
untaped-recipe = { workspace = true }
untaped-workspace = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260518",
    "untaped[all]",
    "vulture>=2.16",
]
diff-coverage = [
    "diff-cover>=10.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# First-party code for import sorting: each package's src/ and the test packages.
src = [".", "packages/*/src", "packages/*/tests", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "C90",  # mccabe complexity (gate set in [tool.ruff.lint.mccabe])
    "RUF",  # ruff-specific
]
extend-select = ["PLC0415"]
ignore = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Tests can use assert statements; in-function imports are routine and
# idiomatic in tests (no startup-latency cost).
"**/tests/**" = ["S101", "PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
# Type-check every package's src/ and the release script; tests are validated by running them.
files = [
    "packages/untaped/src",
    "packages/untaped-ansible/src",
    "packages/untaped-awx/src",
    "packages/untaped-dotfiles/src",
    "packages/untaped-github/src",
    "packages/untaped-jira/src",
    "packages/untaped-recipe/src",
    "packages/untaped-workspace/src",
    "scripts/check_pr.py",
    "scripts/release.py",
]
mypy_path = [
    "packages/untaped/src",
    "packages/untaped-ansible/src",
    "packages/untaped-awx/src",
    "packages/untaped-dotfiles/src",
    "packages/untaped-github/src",
    "packages/untaped-jira/src",
    "packages/untaped-recipe/src",
    "packages/untaped-workspace/src",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "packages/untaped/tests",
    "packages/untaped-ansible/tests",
    "packages/untaped-awx/tests",
    "packages/untaped-dotfiles/tests",
    "packages/untaped-github/tests",
    "packages/untaped-jira/tests",
    "packages/untaped-recipe/tests",
    "packages/untaped-workspace/tests",
    "tests",
]
pythonpath = [
    "scripts",
    "packages/untaped/tests",
    "packages/untaped-ansible/tests",
    "packages/untaped-awx/tests",
    "packages/untaped-dotfiles/tests",
    "packages/untaped-github/tests",
    "packages/untaped-jira/tests",
    "packages/untaped-recipe/tests",
    "packages/untaped-workspace/tests",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]

[tool.vulture]
# Dead-code scan of shipped code (tests are left out: code only tests use is
# dead too). New findings fail pre-commit; see CONTRIBUTING.md#dead-code.
paths = [
    "packages/untaped/src",
    "packages/untaped-ansible/src",
    "packages/untaped-awx/src",
    "packages/untaped-dotfiles/src",
    "packages/untaped-github/src",
    "packages/untaped-jira/src",
    "packages/untaped-recipe/src",
    "packages/untaped-workspace/src",
    "scripts/vulture_allowlist.py",
]
min_confidence = 60
# Framework-registered code looks unused to a static scan.
ignore_decorators = [
    "@*.command",  # cyclopts registers the command on its app
    "@*.default",
    "@model_validator",  # pydantic calls validators and serializers
    "@field_validator",
    "@model_serializer",
    "@pytest.fixture",  # untaped.testing.plugin autouse fixtures
    "@bindings.add",  # prompt_toolkit key bindings
]
# Fixed framework signatures, and attributes set on third-party objects.
ignore_names = [
    "exc_type",
    "tb",
    "__context",
    "dotenv_settings",
    "env_settings",
    "model_post_init",
    "settings_customise_sources",
    "__call__",
    "row_factory",
    "default_parameter",
    "end_of_options_delimiter",
    "ttimeoutlen",
    "__signature__",
    "__annotations__",
    "code_generator_class",
    "concat",
    "renamed_keys",  # settings ClassVars read by untaped.deprecated_keys
    "retired_keys",
    "deprecated_settings",
]

[tool.coverage.run]
branch = true
source = [
    "packages/untaped/src",
    "packages/untaped-ansible/src",
    "packages/untaped-awx/src",
    "packages/untaped-dotfiles/src",
    "packages/untaped-github/src",
    "packages/untaped-jira/src",
    "packages/untaped-recipe/src",
    "packages/untaped-workspace/src",
]
omit = ["**/tests/**", "**/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
