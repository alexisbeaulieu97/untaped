[project]
name = "untaped-dotfiles"
version = "12.0.0"
description = "Dotfiles plugin for untaped."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexis Beaulieu", email = "alexisbeaulieu97@gmail.com" }]
requires-python = ">=3.14.1"
dependencies = ["tomlkit>=0.13,<1", "untaped==12.0.0", "untaped-git==12.0.0", "untaped-values==12.0.0"]

[project.entry-points."untaped.plugins"]
dotfiles = "untaped_dotfiles.plugin:Dotfiles"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
