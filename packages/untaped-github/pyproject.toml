[project]
name = "untaped-github"
version = "10.0.0"
description = "GitHub plugin for untaped."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexis Beaulieu", email = "alexisbeaulieu97@gmail.com" }]
requires-python = ">=3.14.1"
dependencies = ["untaped==10.0.0"]

[project.entry-points."untaped.plugins"]
github = "untaped_github:provider"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
