[project]
name = "untaped-github"
version = "10.1.0"
description = "GitHub plugin for untaped."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexis Beaulieu", email = "alexisbeaulieu97@gmail.com" }]
requires-python = ">=3.14.1"
dependencies = ["untaped==10.1.0", "untaped-git==10.1.0"]

[project.optional-dependencies]
# Github fills the git plugin's GitHost and workspace's RepoSource contracts: the owner
# extras providers declare.
git = ["untaped-git==10.1.0"]
workspace = ["untaped-workspace==10.1.0"]

[project.entry-points."untaped.plugins"]
github = "untaped_github:SPEC"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
