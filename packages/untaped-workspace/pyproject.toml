[project]
name = "untaped-workspace"
version = "10.0.0a0"
description = "Workspace capability for untaped."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexis Beaulieu", email = "alexisbeaulieu97@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["untaped==10.0.0a0", "untaped-github==10.0.0a0"]

[project.entry-points."untaped.capabilities"]
workspace = "untaped_workspace:provider"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
