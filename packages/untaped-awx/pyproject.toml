[project]
name = "untaped-awx"
version = "10.0.0"
description = "AWX capability for untaped."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexis Beaulieu", email = "alexisbeaulieu97@gmail.com" }]
requires-python = ">=3.14.1"
dependencies = ["jinja2>=3.1.6,<4", "untaped==10.0.0"]

[project.entry-points."untaped.capabilities"]
awx = "untaped_awx:provider"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
