[project]
name = "untaped-ansible"
version = "10.1.0"
description = "Ansible plugin for untaped."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexis Beaulieu", email = "alexisbeaulieu97@gmail.com" }]
requires-python = ">=3.14.1"
dependencies = ["untaped==10.1.0", "untaped-git==10.1.0", "untaped-github==10.1.0"]

[project.entry-points."untaped.plugins"]
ansible = "untaped_ansible:SPEC"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
