[project]
name = "untaped-jira"
version = "10.0.0rc1"
description = "Jira capability for untaped."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexis Beaulieu", email = "alexisbeaulieu97@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["untaped==10.0.0rc1"]

[project.entry-points."untaped.capabilities"]
jira = "untaped_jira:provider"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
