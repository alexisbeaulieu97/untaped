[project]
name = "untaped-hello"
version = "0.1.0"
description = "A minimal example capability for untaped."
readme = "README.md"
requires-python = ">=3.14.1"
dependencies = ["untaped>=10,<11", "pydantic>=2.13.3,<3"]

[project.entry-points."untaped.capabilities"]
hello = "untaped_hello:provider"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
