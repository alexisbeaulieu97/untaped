[project]
name = "untaped-library"
version = "0.1.0"
description = "An example contract provider for untaped: lends its books to untaped-shelf."
readme = "README.md"
requires-python = ">=3.14.1"
dependencies = ["untaped>=10,<11", "untaped-shelf>=0.1,<1", "pydantic>=2.13.3,<3"]

[project.entry-points."untaped.plugins"]
library = "untaped_library:provider"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
