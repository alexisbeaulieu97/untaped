[project]
name = "untaped-library"
version = "0.1.0"
description = "An example contract provider for untaped: lends its books to untaped-shelf."
readme = "README.md"
requires-python = ">=3.14.1"
dependencies = ["untaped>=11.1,<12", "pydantic>=2.13.3,<3", "untaped-shelf>=0.1,<0.2"]

[project.entry-points."untaped.plugins"]
library = "untaped_library.plugin:Library"

[dependency-groups]
dev = ["pytest>=9", "untaped[lint]>=11.1,<12"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
